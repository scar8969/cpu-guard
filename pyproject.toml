[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-guard"
version = "1.0.0"
description = "Resource management middleware for Python web apps: CPU/memory limiting, gradual throttling, rate limiting, health checks, Prometheus metrics, and a real-time dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Rout", email = "priyanshurout8969@gmail.com" }]
keywords = ["middleware", "cpu", "memory", "rate-limiting", "throttling", "fastapi", "starlette", "monitoring", "asgi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
demo = ["fastapi>=0.100", "uvicorn>=0.23"]
test = ["pytest>=7", "pytest-asyncio>=0.21", "httpx>=0.24", "fastapi>=0.100", "uvicorn>=0.23"]

[project.scripts]
cpu-guard = "cpu_guard.cli:main"

[tool.setuptools.packages.find]
include = ["cpu_guard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
